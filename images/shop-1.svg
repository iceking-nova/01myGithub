<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef6f5"/><stop offset="100%" stop-color="#fce4ec"/></linearGradient>
    <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff5f7"/><stop offset="100%" stop-color="#ffecee"/></linearGradient>
  </defs>
  <!-- 背景墙 -->
  <rect width="800" height="500" fill="url(#bg1)"/>
  <!-- 地板 -->
  <rect y="370" width="800" height="130" fill="#f0e0d8"/>
  <!-- 地板砖缝 -->
  <line x1="0" y1="370" x2="800" y2="370" stroke="#e8d0c8" stroke-width="2"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#e8d0c8" stroke-width="1"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#e8d0c8" stroke-width="1"/>
  <line x1="100" y1="370" x2="100" y2="500" stroke="#e8d0c8" stroke-width="1"/>
  <line x1="200" y1="370" x2="200" y2="500" stroke="#e8d0c8" stroke-width="1"/>
  <line x1="300" y1="370" x2="300" y2="500" stroke="#e8d0c8" stroke-width="1"/>
  <line x1="400" y1="370" x2="400" y2="500" stroke="#e8d0c8" stroke-width="1"/>
  <line x1="500" y1="370" x2="500" y2="500" stroke="#e8d0c8" stroke-width="1"/>
  <line x1="600" y1="370" x2="600" y2="500" stroke="#e8d0c8" stroke-width="1"/>
  <line x1="700" y1="370" x2="700" y2="500" stroke="#e8d0c8" stroke-width="1"/>
  <!-- 墙壁 -->
  <rect x="20" y="20" width="760" height="350" rx="8" fill="url(#wall1)" stroke="#f0d0d0" stroke-width="2"/>
  <!-- 背景画 -->
  <rect x="320" y="50" width="160" height="120" rx="6" fill="#ffe0f0" stroke="#f7a1b5" stroke-width="1.5"/>
  <circle cx="380" cy="95" r="20" fill="#f7a1b5" opacity=".6"/>
  <circle cx="420" cy="85" r="16" fill="#f7a1b5" opacity=".5"/>
  <ellipse cx="400" cy="130" rx="60" ry="18" fill="#f7a1b5" opacity=".3"/>
  <!-- 前台桌 -->
  <rect x="520" y="240" width="220" height="130" rx="10" fill="#f5e6e0" stroke="#e8c8c0" stroke-width="2"/>
  <rect x="530" y="250" width="200" height="30" rx="4" fill="#fceae5" stroke="#e8d0c8" stroke-width="1"/>
  <rect x="540" y="290" width="80" height="40" rx="4" fill="#e8d0c8" opacity=".5"/>
  <!-- 前台装饰 -->
  <rect x="550" y="235" width="30" height="8" rx="4" fill="#f7a1b5"/>
  <rect x="590" y="235" width="60" height="8" rx="4" fill="#a8d8ea"/>
  <!-- 前台小旗子 -->
  <rect x="640" y="225" width="5" height="18" fill="#888"/>
  <polygon points="645,225 660,230 645,235" fill="#f7a1b5"/>
  <!-- 沙发上 -->
  <rect x="100" y="230" width="200" height="140" rx="16" fill="#f7c8d0" stroke="#e8a0b0" stroke-width="2"/>
  <rect x="110" y="240" width="180" height="40" rx="10" fill="#fac8d8"/>
  <!-- 沙发垫子 -->
  <rect x="110" y="280" width="80" height="80" rx="8" fill="#fce4ec"/>
  <rect x="200" y="280" width="80" height="80" rx="8" fill="#fce4ec"/>
  <!-- 沙发上狗狗 -->
  <ellipse cx="170" cy="270" rx="30" ry="25" fill="#e8a070"/>
  <circle cx="160" cy="250" r="18" fill="#e8a070"/>
  <circle cx="170" cy="270" r="6" fill="#c08050"/>
  <circle cx="155" cy="244" r="4" fill="#333"/>
  <circle cx="170" cy="244" r="4" fill="#333"/>
  <ellipse cx="162" cy="254" rx="5" ry="3" fill="#c08050"/>
  <polygon points="145,237 140,220 155,232" fill="#e8a070"/>
  <polygon points="168,233 172,215 180,230" fill="#e8a070"/>
  <!-- 地板玩具 -->
  <circle cx="480" cy="390" r="10" fill="#f7a1b5" opacity=".7"/>
  <circle cx="520" cy="400" r="8" fill="#a8d8ea" opacity=".7"/>
  <!-- 天花板灯 -->
  <rect x="370" y="10" width="60" height="10" rx="3" fill="#ddd"/>
  <rect x="385" y="0" width="30" height="12" rx="2" fill="#eee"/>
  <ellipse cx="400" cy="20" rx="25" ry="8" fill="#fff9c0" opacity=".6"/>
  <!-- 绿植 -->
  <rect x="700" y="340" width="12" height="30" rx="3" fill="#8d6e63"/>
  <circle cx="706" cy="330" r="18" fill="#81c784" opacity=".8"/>
  <circle cx="696" cy="320" r="14" fill="#66bb6a" opacity=".7"/>
  <circle cx="716" cy="322" r="12" fill="#aed581" opacity=".7"/>
  <!-- 标牌 -->
  <rect x="280" y="25" width="240" height="38" rx="19" fill="#f7a1b5" opacity=".85"/>
  <text x="400" y="51" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">🐾 宠爱有家 · 宠物洗护</text>
  <!-- 服务台标签 -->
  <text x="630" y="365" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">前台接待</text>
</svg>
