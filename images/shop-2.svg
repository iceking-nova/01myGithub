  <ellipse cx="232" cy="160" rx="16" ry="5" fill="#bbb"/>
  <!-- 水柱 -->
  <rect x="226" y="163" width="3" height="18" fill="#a8d8ea" opacity=".5"/>
  <rect x="232" y="163" width="3" height="15" fill="#a8d8ea" opacity=".4"/>
  <rect x="238" y="163" width="3" height="12" fill="#a8d8ea" opacity=".3"/>
