  <rect x="480" y="240" width="120" height="4" fill="#d0c8c0"/>
  <rect x="480" y="280" width="120" height="4" fill="#d0c8c0"/>
  <rect x="480" y="320" width="120" height="4" fill="#d0c8c0"/>
  <!-- 工具 -->
  <rect x="500" y="220" width="8" height="20" rx="2" fill="#f7a1b5"/>
  <rect x="520" y="225" width="8" height="15" rx="2" fill="#a8d8ea"/>
  <rect x="540" y="222" width="8" height="18" rx="2" fill="#81c784"/>
  <rect x="505" y="250" width="20" height="8" rx="2" fill="#bbb"/>
  <rect x="535" y="252" width="15" height="8" rx="2" fill="#bbb"/>
  <circle cx="530" cy="295" r="8" fill="#f7a1b5" opacity=".5"/>
  <circle cx="550" cy="298" r="6" fill="#a8d8ea" opacity=".5"/>
  <ellipse cx="510" cy="310" rx="12" ry="6" fill="#e8e0d8" stroke="#ccc" stroke-width="1"/>
  <!-- 烘干箱 -->
  <rect x="630" y="220" width="130" height="140" rx="12" fill="#fce4ec" stroke="#e8a0b0" stroke-width="2"/>
  <rect x="640" y="230" width="110" height="120" rx="8" fill="#fff" opacity=".5"/>
  <rect x="640" y="230" width="110" height="120" rx="8" fill="none" stroke="#f0d0d8" stroke-width="1"/>
  <circle cx="645" cy="236" r="2" fill="#4caf50"/>
  <text x="695" y="375" text-anchor="middle" fill="#888" font-size="12" font-family="sans-serif">烘干箱</text>
  <!-- 天花灯 -->
  <rect x="350" y="5" width="100" height="8" rx="3" fill="#ddd"/>
  <ellipse cx="400" cy="18" rx="35" ry="10" fill="#fff9c0" opacity=".5"/>
  <!-- 温度标签 -->
  <rect x="650" y="235" width="30" height="14" rx="3" fill="#a8d8ea" opacity=".6"/>
  <text x="665" y="246" text-anchor="middle" fill="#fff" font-size="8" font-family="sans-serif">38°C</text>
  <!-- 水桶 -->
  <rect x="80" y="330" width="30" height="30" rx="4" fill="#a8d8ea" opacity=".5"/>
  <rect x="78" y="328" width="34" height="5" rx="2" fill="#a8d8ea" opacity=".4"/>
</svg>
