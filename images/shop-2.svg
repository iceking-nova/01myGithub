<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0f8ff"/><stop offset="100%" stop-color="#e0f0f8"/></linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="800" height="500" fill="url(#bg2)"/>
