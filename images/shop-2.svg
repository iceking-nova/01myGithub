  <ellipse cx="300" cy="280" rx="40" ry="35" fill="#f5d0a0"/>
  <circle cx="310" cy="250" r="28" fill="#f5d0a0"/>
  <circle cx="300" cy="278" r="10" fill="#e8b870" opacity=".6"/>
  <circle cx="300" cy="250" r="6" fill="#333"/>
  <circle cx="320" cy="248" r="6" fill="#333"/>
  <ellipse cx="310" cy="262" rx="8" ry="4" fill="#e8b870"/>
  <polygon points="290,230 280,210 300,225" fill="#f5d0a0"/>
  <polygon points="322,228 330,208 335,225" fill="#f5d0a0"/>
  <!-- 泡沫 -->
  <circle cx="340" cy="240" r="10" fill="#fff" opacity=".8"/>
  <circle cx="355" cy="255" r="8" fill="#fff" opacity=".7"/>
  <circle cx="280" cy="290" r="9" fill="#fff" opacity=".7"/>
  <circle cx="320" cy="295" r="7" fill="#fff" opacity=".6"/>
  <circle cx="260" cy="260" r="6" fill="#fff" opacity=".65"/>
  <!-- 美容工具架 -->
