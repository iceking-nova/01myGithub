  <line x1="0" y1="400" x2="800" y2="400" stroke="#c0d8c4" stroke-width="1"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#c0d8c4" stroke-width="1"/>
  <line x1="80" y1="360" x2="80" y2="500" stroke="#c0d8c4" stroke-width="1"/>
  <line x1="160" y1="360" x2="160" y2="500" stroke="#c0d8c4" stroke-width="1"/>
  <line x1="240" y1="360" x2="240" y2="500" stroke="#c0d8c4" stroke-width="1"/>
  <line x1="320" y1="360" x2="320" y2="500" stroke="#c0d8c4" stroke-width="1"/>
  <line x1="400" y1="360" x2="400" y2="500" stroke="#c0d8c4" stroke-width="1"/>
  <line x1="480" y1="360" x2="480" y2="500" stroke="#c0d8c4" stroke-width="1"/>
  <line x1="560" y1="360" x2="560" y2="500" stroke="#c0d8c4" stroke-width="1"/>
  <line x1="640" y1="360" x2="640" y2="500" stroke="#c0d8c4" stroke-width="1"/>
  <line x1="720" y1="360" x2="720" y2="500" stroke="#c0d8c4" stroke-width="1"/>
  <!-- 洗护台 -->
  <rect x="100" y="160" width="280" height="200" rx="10" fill="#f0f0f0" stroke="#ddd" stroke-width="2"/>
  <!-- 水池 -->
  <ellipse cx="240" cy="200" rx="70" ry="30" fill="#d5e8f0" stroke="#a8d8ea" stroke-width="2"/>
  <ellipse cx="240" cy="200" rx="55" ry="22" fill="#b0d8e8" opacity=".6"/>
  <!-- 水龙头 -->
  <rect x="235" y="155" width="10" height="20" rx="3" fill="#ccc"/>
  <rect x="225" y="150" width="30" height="6" rx="3" fill="#ccc"/>
